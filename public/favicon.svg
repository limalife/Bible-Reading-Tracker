<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 배경: 앱 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A88A" />
      <stop offset="50%" stop-color="#6C9BB8" />
      <stop offset="100%" stop-color="#7D8CE0" />
    </linearGradient>

    <!-- 페이지 흰색 그라디언트 -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F4FA" />
    </linearGradient>

    <!-- 책등 부근 페이지 안쪽 음영 -->
    <linearGradient id="leftInnerShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="rightInnerShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- 텍스트 라인 색상 (앱 컬러 옅게) -->
    <linearGradient id="textLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55A88A" />
      <stop offset="100%" stop-color="#7D8CE0" />
    </linearGradient>

    <!-- 십자가 그라디언트 -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A88A" />
      <stop offset="50%" stop-color="#6C9BB8" />
      <stop offset="100%" stop-color="#7D8CE0" />
    </linearGradient>

    <!-- 따뜻한 빛 후광 (책 위) -->
    <radialGradient id="warmHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FFE9A8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0" />
    </radialGradient>

    <!-- 십자가 그림자 -->
    <filter id="crossShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 책 그림자 -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bgGrad)"/>

  <!-- 책 위 따뜻한 빛 후광 (큰 영역) -->
  <circle cx="256" cy="200" r="180" fill="url(#warmHalo)"/>

  <!-- 책 아래 그림자 -->
  <ellipse cx="256" cy="424" rx="150" ry="10" fill="#000000" opacity="0.15"/>

  <g filter="url(#bookShadow)">
    <!-- 왼쪽 페이지 -->
    <path
      d="M 110 256
         Q 110 248 118 248
         L 250 248
         Q 254 248 254 252
         L 254 412
         Q 254 416 250 416
         L 118 416
         Q 110 416 110 408 Z"
      fill="url(#pageGrad)"/>

    <!-- 오른쪽 페이지 -->
    <path
      d="M 402 256
         Q 402 248 394 248
         L 262 248
         Q 258 248 258 252
         L 258 412
         Q 258 416 262 416
         L 394 416
         Q 402 416 402 408 Z"
      fill="url(#pageGrad)"/>

    <!-- 페이지 안쪽 음영 (책등 양쪽 깊이감) -->
    <rect x="222" y="248" width="32" height="168" fill="url(#leftInnerShadow)"/>
    <rect x="258" y="248" width="32" height="168" fill="url(#rightInnerShadow)"/>

    <!-- 가운데 책등 음영 -->
    <rect x="254" y="248" width="4" height="168" fill="#B8C0CC" opacity="0.7"/>
  </g>

  <!-- 텍스트 라인 (왼쪽 페이지) -->
  <g opacity="0.32">
    <rect x="138" y="288" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="138" y="306" width="92"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="138" y="324" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="138" y="342" width="84"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="138" y="360" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="138" y="378" width="78"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
  </g>

  <!-- 텍스트 라인 (오른쪽 페이지) -->
  <g opacity="0.32">
    <rect x="274" y="288" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="274" y="306" width="92"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="274" y="324" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="274" y="342" width="84"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="274" y="360" width="100" height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
    <rect x="274" y="378" width="78"  height="3.5" rx="1.5" fill="url(#textLineGrad)"/>
  </g>

  <!-- 책 위 떠있는 그라디언트 십자가 -->
  <g filter="url(#crossShadow)">
    <rect x="246" y="142" width="20" height="116" rx="3" fill="url(#crossGrad)"/>
    <rect x="216" y="180" width="80" height="20"  rx="3" fill="url(#crossGrad)"/>
  </g>

</svg>
